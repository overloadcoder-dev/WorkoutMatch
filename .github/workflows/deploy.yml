name: Verify and deploy WorkoutMatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run check
          npm run lint
          npm test

      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium

      - name: Validate the production origin
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node --input-type=module -e "const raw = process.env.PUBLIC_SITE_URL; if (!raw) throw new Error('Set the PUBLIC_SITE_URL repository variable before deploying.'); const url = new URL(raw); if (url.pathname !== '/') throw new Error('This build currently requires a domain-root URL or custom domain, not a GitHub project subpath.');"

      - name: Build for GitHub Pages
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run build

      - name: Run browser and accessibility checks
        run: npx playwright test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
